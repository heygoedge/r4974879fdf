<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="color-scheme" content="light only"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"><meta name="referrer" content="no-referrer"><title>10 月 20 日 · 华发 · 弯型分析（每趟重新校准） · Heygo</title>
<style>
html{color-scheme:light} :root{--ink:#1d2433;--sub:#5b6577;--line:#e6e9ef;--bg:#f6f7fb;--blue:#2a6fdb}
*{box-sizing:border-box} body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px 60px} h1{font-size:23px;margin:18px 0 4px} .by{color:var(--sub);font-size:14px}
.pick{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)} .pick select{width:100%;max-width:560px;font-size:16px;padding:8px 10px;border:1px solid var(--blue);border-radius:10px;background:#fff;color:var(--ink)}
h2{font-size:18px;margin:24px 0 6px} h3{font-size:16px;margin:0} .th{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap} .th .t{font-size:12px;color:var(--sub)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px} .chips span{background:var(--bg);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--sub)} .chips b{color:var(--ink)} .fl{font-size:12px;color:var(--sub);margin-top:6px}
.r1,.r2,.r3{display:grid;gap:6px;margin-top:8px} .r3{grid-template-columns:minmax(0,1fr)} .r3 img{width:100%;max-width:760px;display:block;border:1px solid var(--line);border-radius:8px;background:#fff} .r1{grid-template-columns:25.5% 1fr} .r2{grid-template-columns:1fr 1fr;align-items:start} .r1 img,.r2 img{width:100%;display:block;border:1px solid var(--line);border-radius:8px;background:#fff}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px} .nav a{font-size:12px;padding:2px 9px;border:1px solid var(--blue);border-radius:999px;color:var(--blue);text-decoration:none}
.tabs input{display:none} .btns{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap} .btns label{flex:1;min-width:90px;text-align:center;padding:6px;border:1px solid var(--blue);border-radius:999px;color:var(--blue);font-size:13px;cursor:pointer}
.tabs .pane{display:none} .tabs .pane img{max-width:440px;width:100%;display:block;margin:6px auto}
.tabs input:nth-of-type(1):checked ~ .panes .p0,.tabs input:nth-of-type(2):checked ~ .panes .p1,.tabs input:nth-of-type(3):checked ~ .panes .p2,.tabs input:nth-of-type(4):checked ~ .panes .p3,.tabs input:nth-of-type(5):checked ~ .panes .p4{display:block}
.tabs input:nth-of-type(1):checked ~ .btns label:nth-of-type(1),.tabs input:nth-of-type(2):checked ~ .btns label:nth-of-type(2),.tabs input:nth-of-type(3):checked ~ .btns label:nth-of-type(3),.tabs input:nth-of-type(4):checked ~ .btns label:nth-of-type(4),.tabs input:nth-of-type(5):checked ~ .btns label:nth-of-type(5){background:var(--blue);color:#fff}
.cap{font-size:13px;color:var(--sub)} .sync{display:grid;grid-template-columns:300px minmax(0,420px);justify-content:center;gap:14px;align-items:start} .sync video{width:100%;background:#000} canvas{width:100%;height:540px;border:1px solid var(--line);border-radius:8px;background:#fff} .live{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px} .live div{background:var(--bg);border-radius:8px;padding:6px;text-align:center;font-size:12px;color:var(--sub)} .live b{display:block;font-size:18px;color:var(--ink)} .tg{display:grid;grid-template-columns:200px 1fr;gap:10px;margin-top:8px;align-items:center} .tg .lt video{width:200px;background:#000;display:block} .tg .novid{width:190px;font-size:12px;color:var(--sub);text-align:center} .tg .rt .r1,.tg .rt .r2{margin-top:0} .tg .rt{display:grid;gap:6px}
@media(max-width:700px){.sync{grid-template-columns:minmax(0,1fr)} .sync>*{min-width:0} .sync video{max-width:300px;display:block;margin:0 auto} canvas{height:460px} .r1,.r2,.tg{grid-template-columns:minmax(0,1fr)} .tg .lt video,.tg .novid{width:100%;max-width:260px;margin:0 auto}}
</style></head><body><div class="wrap">
<h1>10 月 20 日 · 华发 · 弯型分析（每趟重新校准）</h1><div class="by">Heygo 团队 · 2026 年 10 月 20 日</div>
<div class="pick"><select id="pick"></optgroup></select></div>
</div>
<script>
function lazy(s){s.querySelectorAll('[data-poster]').forEach(el=>{el.poster=el.dataset.poster;el.removeAttribute('data-poster')});s.querySelectorAll('[data-src]').forEach(el=>{el.src=el.dataset.src;el.removeAttribute('data-src')})}
const ALL={};
const players={};
function Player(sec,D){const v=sec.querySelector('video.full'),c=sec.querySelector('canvas'),g=c.getContext('2d');
let W,H,sc,ox,oy,ms,mox,moy,MW,LW,AW,cur=0;const n=D.sec.length,Lm=Math.max(...D.L)*0.9;
const x0=Math.min(...D.X),x1=Math.max(...D.X),y0=Math.min(...D.Y),y1=Math.max(...D.Y);
function fit(){const r=c.getBoundingClientRect(),dp=devicePixelRatio||1;if(!r.width)return;c.width=r.width*dp;c.height=r.height*dp;g.setTransform(dp,0,0,dp,0,0);W=r.width;H=r.height;
ms=(H-20)/(y1-y0);MW=ms*(x1-x0)+20;LW=Math.min(96,W*0.24);AW=W-MW-LW;mox=W-10-ms*x1;moy=10+ms*y1;sc=Math.min(H/36,(AW-24)/(x1-x0));}
const px=i=>ox+sc*D.X[i],py=i=>oy-sc*D.Y[i],mx=i=>mox+ms*D.X[i],my=i=>moy-ms*D.Y[i];
function idx(s){let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(D.sec[m]<s)lo=m;else hi=m}return lo}
function col(i){return `rgba(42,111,219,${0.15+0.85*Math.min(1,D.L[i]/Lm)})`}
function draw(){if(!W)return;const s=v.currentTime+D.off;cur=(s>=D.sec[0]&&s<=D.sec[n-1])?idx(s):(s<D.sec[0]?0:n-1);
ox=AW/2-sc*(x0+x1)/2;oy=H/2+sc*D.Y[cur];
g.clearRect(0,0,W,H);g.fillStyle='#fff';g.fillRect(0,0,W,H);g.lineCap='round';
g.fillStyle='#f6f7fb';g.fillRect(AW+LW,0,MW,H);g.strokeStyle='#e6e9ef';g.lineWidth=1;g.beginPath();g.moveTo(AW+LW,0);g.lineTo(AW+LW,H);g.stroke();
g.save();g.beginPath();g.rect(0,0,AW,H);g.clip();g.lineWidth=9;
for(let i=0;i<n-1;i++){const y=py(i);if(y<-20||y>H+20)continue;g.strokeStyle=col(i);g.beginPath();g.moveTo(px(i),py(i));g.lineTo(px(i+1),py(i+1));g.stroke()}
g.restore();g.strokeStyle='#bbb';g.lineWidth=1;g.beginPath();g.moveTo(AW+4,0);g.lineTo(AW+4,H);g.stroke();
g.font='12px sans-serif';let last=-99;
for(const t of D.turns){const i=idx(t.t0),y=py(i);if(y<-10||y>H+10)continue;const yl=Math.max(y,last+15);last=yl;
g.strokeStyle='#d5dbe5';g.setLineDash([3,3]);g.beginPath();g.moveTo(px(i),y);g.lineTo(AW+4,y);g.stroke();g.setLineDash([]);
g.fillStyle='#333';g.fillRect(px(i)-5,y-1,10,2);g.fillText('T'+t.k+' '+t.e+t.l,AW+9,yl+4)}
g.strokeStyle='#888';g.lineWidth=1;g.beginPath();g.moveTo(14,H-14);g.lineTo(14+sc*5,H-14);g.stroke();g.fillStyle='#888';g.font='11px sans-serif';g.fillText('5 米',16,H-18);
g.lineWidth=3;for(let i=0;i<n-1;i++){g.strokeStyle=col(i);g.beginPath();g.moveTo(mx(i),my(i));g.lineTo(mx(i+1),my(i+1));g.stroke()}
g.strokeStyle='rgba(224,48,58,.6)';g.lineWidth=1;g.strokeRect(mox+ms*x0-6,my(cur)-ms*18,ms*(x1-x0)+12,ms*36);
const board=(i,al)=>{const a=Math.max(0,i-2),b=Math.min(n-1,i+2),ang=Math.atan2(py(b)-py(a),px(b)-px(a)),L=Math.max(1.55*sc,36),W=Math.max(7,0.3*sc);
g.save();g.translate(px(i),py(i));g.rotate(ang);g.globalAlpha=al;g.fillStyle='#1d2433';g.beginPath();
if(g.roundRect)g.roundRect(-L/2,-W/2,L,W,W/2);else g.rect(-L/2,-W/2,L,W);g.fill();
g.fillStyle='#e0303a';g.beginPath();g.arc(L/2-W*0.6,0,W*0.42,0,7);g.fill();
g.fillStyle='#fff';g.beginPath();g.arc(L*0.18,0,W*0.22,0,7);g.arc(-L*0.18,0,W*0.22,0,7);g.fill();g.restore();g.globalAlpha=1};
for(const[dtb,al]of[[15,0.15],[10,0.25],[5,0.4]])board(Math.max(0,cur-dtb),al);board(cur,1);g.beginPath();g.arc(mx(cur),my(cur),3.5,0,7);g.fill();
const t=D.turns.find(t=>s>=t.t0&&s<t.t1);sec.querySelector('.lk').textContent=t?('T'+t.k+' '+t.e):'—';
sec.querySelector('.lg').textContent=D.L[cur].toFixed(2)+' g'}
function loop(){draw();if(!v.paused)requestAnimationFrame(loop)}
v.addEventListener('play',loop);v.addEventListener('seeked',draw);v.addEventListener('timeupdate',()=>{if(v.paused)draw()});v.addEventListener('loadedmetadata',draw);
c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let b=0,bd=1e9;for(let i=0;i<n;i++){const d=Math.min((px(i)-x)**2+(py(i)-y)**2,(mx(i)-x)**2+(my(i)-y)**2);if(d<bd){bd=d;b=i}}v.currentTime=Math.max(0,D.sec[b]-D.off);draw()});
addEventListener('resize',()=>{fit();draw()});return {show(){fit();draw()}}}
const io=new IntersectionObserver(es=>es.forEach(x=>{const el=x.target;if(x.isIntersecting){if(!el.getAttribute('src'))el.src=el.dataset.clip;el.play().catch(()=>{})}else if(el.getAttribute('src')){el.pause();el.removeAttribute('src');el.load()}}),{threshold:.3});
function show(k){document.querySelectorAll('section.run').forEach(s=>{const on=s.id==='s-'+k;s.hidden=!on;if(!on)s.querySelectorAll('video').forEach(v=>{v.pause();if(v.dataset.clip&&v.getAttribute('src')){v.removeAttribute('src');v.load()}})});
const sec=document.getElementById('s-'+k);lazy(sec);sec.querySelectorAll('.turn video').forEach(v=>io.observe(v));
if(ALL[k]){if(!players[k])players[k]=Player(sec,ALL[k]);players[k].show()}if(location.hash.slice(1)!==k)history.replaceState(null,'','#'+k)}
const pick=document.getElementById('pick');pick.addEventListener('change',()=>{show(pick.value);scrollTo(0,0)});
const h=location.hash.slice(1).replace(/-t[0-9]+$/,'');if([...pick.options].some(o=>o.value===h))pick.value=h;show(pick.value);
</script></body></html>
